name: Release

# When a release is published on GitHub (Releases > Draft a new release), build
# and test executables for Windows, macOS and Linux and attach them to it.
# Can also be run by hand from the Actions tab for an existing release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach executables to (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: linux-x64
            os: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: bash tools/package.sh build "$TAG" ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: histsim-*.zip

  upload:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: Upload executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" histsim-*.zip --clobber --repo "$GITHUB_REPOSITORY"
