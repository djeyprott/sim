name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
            werror: ON
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
            werror: ON
          - name: macos-arm64-clang
            os: macos-latest
            cxx: clang++
            werror: ON
          - name: windows-msvc
            os: windows-latest
            cxx: ''   # default Visual Studio generator picks MSVC
            werror: OFF
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cxx != '' && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
          -DHISTSIM_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # A longer run than the golden-hash unit test, compared across all
      # platforms in the determinism job below.
      - name: Record determinism hash
        shell: bash
        run: |
          exe=build/cli/histsim
          [ -f build/cli/Release/histsim.exe ] && exe=build/cli/Release/histsim.exe
          # Strip CR: on Windows the C runtime writes text output with CRLF.
          plain=$("$exe" run --seed 1 --level 6 --years 500 --hash-only | tr -d '\r')
          # The same check with every kind of intervention applied.
          meddled=$("$exe" run --seed 2 --level 4 --years 300 --hash-only \
            --at 50:eruption:12 --at 80:plague:1439:2000:0.5 --at 100:forcing:3 \
            --at 120:climate:1439:1500:-3:-0.4:25 --at 130:settlers:1439:3000 \
            --at 140:game:1439:900:0.1 --at 150:wipeout:1439:300 --at 160:bond:2:200 | tr -d '\r')
          # Long enough for domestication, farming and Bond events.
          farmed=$("$exe" run --seed 3 --level 4 --years 2500 --hash-only | tr -d '\r')
          echo "$plain $meddled $farmed" > hash-${{ matrix.name }}.txt
          echo "::notice title=determinism hash::${{ matrix.name }} $(cat hash-${{ matrix.name }}.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

      # A tested, ready-to-run build of this commit, downloadable from the run
      # page (Actions > CI > the run > Artifacts).
      - name: Package executable
        if: matrix.name != 'linux-clang'
        shell: bash
        env:
          PACKAGE_NO_ZIP: '1'
        run: bash tools/package.sh build "dev-${GITHUB_SHA::7}" ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: matrix.name != 'linux-clang'
        with:
          name: histsim-${{ matrix.name }}
          path: histsim-dev-*/
          retention-days: 30

  determinism:
    name: cross-platform determinism
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          merge-multiple: true
      - name: All platforms must produce the same hash
        run: |
          summary=""
          for f in hash-*.txt; do
            name="${f#hash-}"; name="${name%.txt}"
            summary="$summary $name=$(tr -d '\r\n' < "$f")"
          done
          echo "$summary"
          if [ "$(cat hash-*.txt | tr -d '\r' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error title=determinism::Simulation results differ between platforms:$summary"
            exit 1
          fi
          echo "::notice title=determinism::All platforms agree:$summary"

  # Optimized with debug info: the sanitizers catch the same errors, and the
  # long-run tests (the M1 and M2 gates) finish in minutes rather than tens.
  sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
