name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
            werror: ON
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
            werror: ON
          - name: macos-arm64-clang
            os: macos-latest
            cxx: clang++
            werror: ON
          - name: windows-msvc
            os: windows-latest
            cxx: ''   # default Visual Studio generator picks MSVC
            werror: OFF
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cxx != '' && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
          -DHISTSIM_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # A longer run than the golden-hash unit test, compared across all
      # platforms in the determinism job below.
      - name: Record determinism hash
        shell: bash
        run: |
          exe=build/cli/histsim
          [ -f build/cli/Release/histsim.exe ] && exe=build/cli/Release/histsim.exe
          # Strip CR: on Windows the C runtime writes text output with CRLF.
          "$exe" run --seed 1 --level 6 --years 500 --hash-only | tr -d '\r' > hash-${{ matrix.name }}.txt
          echo "::notice title=determinism hash::${{ matrix.name }} $(cat hash-${{ matrix.name }}.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

  determinism:
    name: cross-platform determinism
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          merge-multiple: true
      - name: All platforms must produce the same hash
        run: |
          summary=""
          for f in hash-*.txt; do
            name="${f#hash-}"; name="${name%.txt}"
            summary="$summary $name=$(tr -d '\r\n' < "$f")"
          done
          echo "$summary"
          if [ "$(cat hash-*.txt | tr -d '\r' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error title=determinism::Simulation results differ between platforms:$summary"
            exit 1
          fi
          echo "::notice title=determinism::All platforms agree:$summary"

  sanitizers:
    name: linux-sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
